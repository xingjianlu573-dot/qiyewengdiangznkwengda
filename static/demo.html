<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>功能演示 · Enterprise Document Intelligence Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E6E6E'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EEDI%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #F6F5F1; --surface: #FFF; --ink: #182026; --muted: #5B6670;
    --line: #E4E2DA; --accent: #0E6E6E; --accent-deep: #0A5454; --accent-soft: #E3F0EE;
    --ok: #2F7D46; --warn: #B45309; --danger: #B3261E;
    --radius: 12px; --shadow: 0 1px 3px rgba(24,32,38,.08), 0 8px 24px -12px rgba(24,32,38,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.65; font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  /* 顶栏 */
  header.nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
  .brand .sub { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  #conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
  #conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #B0B7BE; }
  #conn.ok { color: var(--ok); border-color: #CDE4D4; background: #F0F7F2; }
  #conn.ok .dot { background: var(--ok); }
  #conn.err { color: var(--danger); border-color: #F0CDCB; background: #FCF0EF; }
  #conn.err .dot { background: var(--danger); }

  /* 主体布局 */
  main.layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; padding: 22px 0 40px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card + .card { margin-top: 18px; }
  .card h2 { font-size: 14.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); display: inline-flex; align-items: center; justify-content: center; }
  .muted { color: var(--muted); font-size: 12.5px; }

  /* 知识库概览 */
  .kpi { display: flex; gap: 10px; margin-bottom: 14px; }
  .kpi .box { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .kpi .num { font-size: 21px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .kpi .lbl { font-size: 11.5px; color: var(--muted); }
  #doc-list { list-style: none; }
  #doc-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  #doc-list li:last-child { border-bottom: none; }
  .fmt { flex: none; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-deep); }
  .fmt.other { background: #F1EFE9; color: var(--muted); }
  .cnt { margin-left: auto; color: var(--muted); font-size: 11.5px; }

  /* 演示问题 */
  .preset { display: grid; gap: 8px; }
  .preset button {
    text-align: left; font-size: 13px; padding: 10px 13px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: all .15s ease; line-height: 1.5;
  }
  .preset button:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
  .preset .tag { font-size: 10.5px; font-weight: 700; margin-right: 6px; color: var(--accent); }
  .preset .tag.reject { color: var(--warn); }

  /* 问答区 */
  .qa-card { min-height: 420px; display: flex; flex-direction: column; }
  .ask-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .ask-row input {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: var(--surface);
  }
  .ask-row input:focus { border-color: var(--accent); }
  .ask-row button {
    padding: 0 22px; border-radius: 10px; border: none; background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .ask-row button:hover { background: var(--accent-deep); }
  .ask-row button:disabled { opacity: .55; cursor: not-allowed; }
  #answer-area { flex: 1; }
  .empty {
    height: 100%; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: #FBFAF7; text-align: center; padding: 24px;
  }
  .empty .t { font-size: 14px; font-weight: 600; color: var(--ink); }
  .empty .s { font-size: 12.5px; max-width: 420px; }
  .answer-box { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: #FBFAF7; white-space: pre-wrap; font-size: 14.5px; line-height: 1.8; }
  .answer-box .q { font-weight: 700; margin-bottom: 10px; color: var(--ink); }
  .answer-box .q::before { content: ""; display: inline-block; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; margin-right: 8px; vertical-align: -2px; }
  .answer-box.rejected { border-color: #E8C9A0; background: #FDF6EC; }
  .meta-row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .meta { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); }
  .meta.reject { background: #FBEBDD; color: var(--warn); }
  .cites { display: grid; gap: 10px; margin-top: 12px; }
  .cite { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 9px; padding: 12px 14px; background: var(--surface); }
  .cite .head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; flex-wrap: wrap; }
  .cite .head .n { font-size: 11px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .cite .head .loc { color: var(--accent-deep); }
  .cite .head .score { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 400; }
  .cite .snippet { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cite.open .snippet { display: block; }
  .cite .toggle { margin-top: 6px; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }

  /* 上传区 */
  .upload-row { display: flex; gap: 10px; }
  .upload-row input[type=file] {
    flex: 1; font-size: 12.5px; padding: 9px 0; color: var(--muted);
  }
  .upload-row button { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
  .upload-row button:hover { background: var(--accent); color: #fff; }
  #upload-status { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
  #upload-status.ok { color: var(--ok); }
  #upload-status.err { color: var(--danger); }

  /* 服务未连接 */
  .offline-banner {
    display: none; background: #FDF6EC; border: 1px solid #E8C9A0; color: var(--warn);
    padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;
  }
  .offline-banner code { background: #F1EFE9; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  @media (max-width: 900px) {
    main.layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <span class="mark">EDI</span>
      <span>功能演示 <span class="sub">Enterprise Document Intelligence Assistant</span></span>
    </div>
    <span id="conn"><span class="dot"></span>连接中…</span>
  </div>
</header>

<main class="layout wrap">
  <!-- 左栏 -->
  <div class="side">
    <div class="offline-banner" id="offline-banner">
      服务未连接。请先在本机启动后端：<code>python scripts/run.py</code>，
      然后刷新本页；或直接访问 <code>http://127.0.0.1:8000</code> 使用完整界面。
    </div>

    <div class="card">
      <h2><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E6E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>知识库概览</h2>
      <div class="kpi">
        <div class="box"><div class="num" id="kpi-docs">–</div><div class="lbl">文档</div></div>
        <div class="box"><div class="num" id="kpi-chunks">–</div><div class="lbl">知识片段</div></div>
        <div class="box"><div class="num" id="kpi-model">–</div><div class="lbl">模型</div></div>
      </div>
      <ul id="doc-list"><li class="muted">加载中…</li></ul>
    </div>

    <div class="card">
      <h2><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E6E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>演示问题（一键提问）</h2>
      <div class="preset">
        <button data-q="电脑蓝屏代码 0x0000007B 怎么处理"><span class="tag">命中</span>Windows 蓝屏怎么处理</button>
        <button data-q="公司网络突然断网，应该按什么顺序排查"><span class="tag">命中</span>网络断网排查顺序</button>
        <button data-q="VPN 提示认证失败怎么办"><span class="tag">命中</span>VPN 认证失败处理</button>
        <button data-q="Outlook 收不到邮件怎么排查"><span class="tag">命中</span>邮箱收不到邮件</button>
        <button data-q="怎么申请年假和报销差旅费"><span class="tag reject">库外</span>年假 / 差旅报销（拒答演示）</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E6E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></span>上传文档（真实入库）</h2>
      <div class="upload-row">
        <input type="file" id="file-input" accept=".pdf,.docx,.doc,.md,.markdown,.txt" />
        <button id="upload-btn">上传</button>
      </div>
      <div id="upload-status"></div>
    </div>
  </div>

  <!-- 右栏：问答 -->
  <div class="card qa-card">
    <h2><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E6E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-1.4 1-1.4 1.9v.3"/><path d="M12 17.5h.01"/></svg></span>文档问答（带引用溯源）</h2>
    <div class="ask-row">
      <input id="query-input" type="text" placeholder="输入你的问题，例如：VPN 提示认证失败怎么办？" maxlength="500" />
      <button id="send-btn">提问</button>
    </div>
    <div id="answer-area">
      <div class="empty">
        <div class="t">等待提问</div>
        <div class="s">点击左侧演示问题，或输入任何与 IT 运维知识库相关的问题。<br />回答将附带来源文档、章节、匹配度与可展开的原文片段。</div>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var API = "";
  var $ = function (s) { return document.querySelector(s); };

  // ---------- API 基地址自适应：同源优先（服务托管 /demo.html），跨源回退（file:// 打开） ----------
  function detect() {
    return new Promise(function (resolve) {
      var t = 3500;
      trySameOrigin();
      function trySameOrigin() {
        fetch("/api/health", { signal: AbortSignal.timeout(t) })
          .then(function (r) { if (r.ok) { API = ""; resolve(true); } else { tryCross(); } })
          .catch(tryCross);
      }
      function tryCross() {
        fetch("http://127.0.0.1:8000/api/health", { signal: AbortSignal.timeout(t) })
          .then(function (r) { if (r.ok) { API = "http://127.0.0.1:8000"; resolve(true); } else { resolve(false); } })
          .catch(function () { resolve(false); });
      }
    });
  }

  var conn = $("#conn");
  function setConn(ok, text) {
    conn.className = ok ? "ok" : "err";
    conn.innerHTML = "<span class='dot'></span>" + text;
  }
  function setOffline(off) {
    $("#offline-banner").style.display = off ? "block" : "none";
    document.querySelectorAll("#doc-list, #answer-area").forEach(function (n) { n.style.opacity = off ? .55 : 1; });
  }

  // ---------- 状态 ----------
  async function loadAll() {
    try {
      var h = await fetch(API + "/api/health").then(function (r) { return r.json(); });
      var provider = h.model_provider === "offline" ? "离线" : h.model_provider;
      $("#kpi-docs").textContent = h.stats.doc_count;
      $("#kpi-chunks").textContent = h.stats.chunk_count;
      $("#kpi-model").textContent = provider;
      setConn(true, "已连接 · " + h.llm_model + " · " + h.embedding_model);
      setOffline(false);
      renderDocs(h.stats.documents || []);
    } catch (e) {
      setConn(false, "服务未连接");
      $("#kpi-docs").textContent = "–";
      $("#kpi-chunks").textContent = "–";
      $("#kpi-model").textContent = "–";
      setOffline(true);
    }
  }

  function fmtName(name) {
    if (/\.pdf$/i.test(name)) return { f: "PDF" };
    if (/\.docx?$/i.test(name)) return { f: "Word" };
    if (/\.md$/i.test(name)) return { f: "MD" };
    return { f: "文本" };
  }
  function renderDocs(docs) {
    var ul = $("#doc-list");
    if (!docs.length) { ul.innerHTML = "<li class='muted'>知识库为空，可上传文档</li>"; return; }
    ul.innerHTML = docs.map(function (d) {
      var t = fmtName(d.name);
      return "<li><span class='fmt" + (t.f === "MD" || t.f === "文本" ? " other" : "") + "'>" + t.f + "</span>" +
        esc(d.name) + "<span class='cnt'>" + d.chunk_count + " 片</span></li>";
    }).join("");
  }

  // ---------- 问答 ----------
  var asking = false;
  async function ask(q) {
    if (!q || asking) return;
    asking = true;
    $("#send-btn").disabled = true;
    $("#answer-area").innerHTML = "<div class='empty'><div class='t'>检索知识库中…</div></div>";
    try {
      var resp = await fetch(API + "/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q }),
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.answer || "请求失败");
      renderAnswer(q, data);
    } catch (e) {
      $("#answer-area").innerHTML = "<div class='empty'><div class='t'>请求失败</div><div class='s'>" + esc(e.message || String(e)) + "</div></div>";
    } finally {
      asking = false;
      $("#send-btn").disabled = false;
    }
  }

  function renderAnswer(q, data) {
    var box = document.createElement("div");
    box.className = "answer-box" + (data.grounded ? "" : " rejected");
    box.innerHTML = "<div class='q'>" + esc(q) + "</div>" + esc(data.answer || "");

    var meta = document.createElement("div");
    meta.className = "meta-row";
    var ms = [];
    if (data.grounded) ms.push("<span class='meta'>基于知识库作答</span>");
    else ms.push("<span class='meta reject'>知识库外问题 · 已拒答（防幻觉）</span>");
    ms.push("<span class='meta'>引擎：" + esc(data.mode || "offline") + "</span>");
    meta.innerHTML = ms.join("");

    var wrap = document.createElement("div");
    wrap.appendChild(box);
    wrap.appendChild(meta);

    var cites = data.citations || [];
    if (cites.length) {
      var list = document.createElement("div");
      list.className = "cites";
      list.innerHTML = cites.map(function (c, i) {
        var loc = [c.doc_name, c.section, c.page ? ("第 " + c.page + " 页") : null].filter(Boolean).join(" · ");
        return "<div class='cite' data-i='" + i + "'><div class='head'><span class='n'>" + (i + 1) + "</span>" +
          "<span class='loc'>" + esc(loc) + "</span>" +
          "<span class='score'>匹配度 " + (c.score != null ? Number(c.score).toFixed(3) : "–") + "</span></div>" +
          "<div class='snippet'>" + esc(c.text || "") + "</div>" +
          "<button class='toggle'>展开原文</button></div>";
      }).join("");
      list.addEventListener("click", function (ev) {
        var b = ev.target.closest && ev.target.closest(".toggle");
        if (!b) return;
        var card = b.closest(".cite");
        card.classList.toggle("open");
        b.textContent = card.classList.contains("open") ? "收起原文" : "展开原文";
      });
      wrap.appendChild(list);
    }
    $("#answer-area").innerHTML = "";
    $("#answer-area").appendChild(wrap);
  }

  // ---------- 上传 ----------
  async function upload(file) {
    var st = $("#upload-status");
    if (!file) { st.className = "err"; st.textContent = "请先选择文件（PDF / Word / Markdown / TXT）"; return; }
    var fd = new FormData();
    fd.append("file", file);
    st.className = ""; st.textContent = "上传并解析入库中…";
    try {
      var resp = await fetch(API + "/api/documents", { method: "POST", body: fd });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || "上传失败");
      st.className = "ok";
      st.textContent = "已入库：《" + data.message.replace(/^文档《|》入库成功$/g, "") + "》 · " + (data.chunks != null ? data.chunks : 0) + " 个知识片段";
      await loadAll();
    } catch (e) {
      st.className = "err";
      st.textContent = "上传失败：" + (e.message || String(e));
    }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- 事件 ----------
  $("#send-btn").addEventListener("click", function () { ask($("#query-input").value.trim()); });
  $("#query-input").addEventListener("keydown", function (e) { if (e.key === "Enter") ask(this.value.trim()); });
  document.querySelectorAll(".preset button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("#query-input").value = b.getAttribute("data-q");
      ask(b.getAttribute("data-q"));
    });
  });
  $("#upload-btn").addEventListener("click", function () { upload($("#file-input").files[0]); });
  $("#file-input").addEventListener("change", function () { $("#upload-status").className = ""; $("#upload-status").textContent = ""; });

  // ---------- 启动 ----------
  detect().then(function (ok) {
    if (ok) { loadAll(); }
    else { setConn(false, "服务未连接"); setOffline(true); }
  });
})();
</script>
</body>
</html>
